{% extends "base.html" %}

{% block content %}
<div class="search-results">
    <h2>🔍 Результати пошуку: "<span id="search-query-display"></span>"</h2>
    
    <div id="users-results-section">
        <h3>👥 Користувачі</h3>
        <div id="users-list" class="users-grid">
            <p class="muted">Завантаження користувачів...</p>
        </div>
    </div>

    <hr style="margin: 40px 0; border-color: rgba(255,255,255,0.1);">

    <div id="drawings-results-section">
        <h3>🎨 Малюнки</h3>
        <div id="drawings-list">
            <p class="muted">Завантаження малюнків...</p>
        </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const q = urlParams.get('q');
    if (q) {
      document.getElementById('search-input').value = q;
      document.getElementById('search-query-display').innerText = q;
      if (typeof loadSearchResults === 'function') loadSearchResults(q);
    } else {
        window.location.href = '/';
    }
  });
</script>
{% endblock %}
